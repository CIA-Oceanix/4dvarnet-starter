# @package _global_

paths:
  masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
  glorys12_data: /Odyssey/public/duacs/2023/duacs_2017_2022_4th.nc
  real_traces: /Odyssey/public/altimetry_traces/2010_2023/gridded/gridded_input.nc
  ref_data_l4: ""
var_name: "sla_filtered"


domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_1patch_2017_2022_SLA_UNet_ResBlock_real_data_Nadir_Duacs_losses_Dataloader_OSE
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 350
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

#datamodule:
#  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
#  input_da: 
#    _target_: contrib.data_loading.data.open_glorys12_data_sla_OSE
#     #open_duacs_data_sla
#    path: ${paths.glorys12_data}
#    masks_path: ${paths.masks_path}
#    real_traces: ${paths.real_traces}
#    domain: ${domain.train}
datamodule:
  _target_: contrib.ose.OSEDataModule
  input_da:
    _target_: contrib.ose.load_ose_data
    bool_file_path: /SCRATCH/d21botvy/da_ose_2010_2019_daily_bool_1deg.nc
    nadir_dir_path: /SCRATCH/d21botvy/gridded_0.25deg
    nadir_fn_pattern: ose_*_daily_sla_0.25deg.nc
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2015-01-01', '2017-04-17']}
    val: 
      time: {_target_: builtins.slice, _args_: ['2017-04-18', '2018-11-30']}
    test: 
      time: {_target_: builtins.slice,  _args_: ['2018-11-01', '2018-11-30']}
  xrds_kw:
    patch_dims: { time: 29, lat: 48, lon: 48}  # previsouly : 680, 1440
    strides: { time: 1, lat: 40, lon: 40} # previously, 672, 1432
    #domain_limits: ${domain.train}
    train:
      patch_dims: { time: 29, lat: 48, lon: 48}
      strides: { time: 1, lat: 40, lon: 40}
      #domain_limits: ${domain.train}
    val:
      patch_dims: { time: 29, lat: 48, lon: 48}
      strides: { time: 1, lat: 40, lon: 40}
      #domain_limits: ${domain.test}
  dl_kw: {batch_size: 32, num_workers: 12}
  aug_kw:
    aug_factor: 1
    aug_only: False # ATTENTION !!!!! CHANGED AUGMENTATION !!!!

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_UNet            #cosanneal_lr_adam
    _partial_: true
    lr: 3e-2
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    _target_: src.models_UNet.UNet    #GradSolverZero
    n_channels: 29
    n_classes: 29
    bilinear: True
    block: 
      _target_: src.parts.ResBlock
      _partial_: True
    add_input: False
      #n_step: 10
      #lr_grad: 1e3
    # lr_grad: 0.2
    #prior_cost:
    # _target_: src.models.BilinAEPriorCost
    # dim_in: ${datamodule.xrds_kw.patch_dims.time}
    # dim_hidden: 64
    # bilin_quad: False
      # bilin_quad: True
      #downsamp: 2
    # obs_cost:
    #_target_: src.models.BaseObsCost
    #grad_mod:
    # _target_: src.models.ConvLstmGradModel
    # dim_in: ${datamodule.xrds_kw.patch_dims.time}
    # dim_hidden: 96
  pre_metric_fn:
        _target_: xarray.Dataset.sel
        _partial_: True
        time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
        lat: ${domain.test.lat}
        lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_

