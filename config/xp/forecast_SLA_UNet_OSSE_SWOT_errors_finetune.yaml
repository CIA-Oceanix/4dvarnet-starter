# @package _global_
# SLA UNet fine-tuned on a nadir + SWOT OSSE with an error model on the swaths (contrib/swot_osse).
# Starts from the weights of the Nadir OSSE UNet (val_mse=3.08068-epoch=204, fresh optimiser and schedule).
# Inputs: GLORYS12 SLA 2010-2019 sampled with real 2024 CLS nadir and SWOT-swath masks; SWOT removed on 30 % of the
# days; noise on nadir (1 cm white) and swaths (1 cm white + 2 cm correlated ~3 deg + 2 cm internal-tide band, tropical
# weighting). Same architecture, windows and loss as base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet.
# The launcher overrides paths.glorys12_data with the node-local /SCRATCH copy.

paths:
  glorys12_data: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_float32.nc
  masks_path: /Odyssey/public/swot_traces/mask/cls_2024_nadir_swot_masks.npz
  init_ckpt: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SLA_UNet/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet/checkpoints/val_mse=3.08068-epoch=204.ckpt

domain:
  train:
    lat: {_target_: builtins.slice, _args_: [-80, 90]}
    lon: {_target_: builtins.slice, _args_: [-180, 180]}
  test:
    lat: {_target_: builtins.slice, _args_: [-79, 89]}
    lon: {_target_: builtins.slice, _args_: [-179, 179]}

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_SLA_UNet_OSSE_SWOT_errors_finetune
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 300
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
  input_da:
    _target_: contrib.swot_osse.data.open_glorys12_data_sla_swot_errors
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    domain: ${domain.train}
    seed: 2024
    swot_dropout: 0.3
    nadir_noise_m: 0.01
    swot_white_m: 0.01
    swot_corr_m: 0.02
    swot_corr_scale_deg: 3.0
    swot_it_m: 0.02
    swot_it_sigmas_deg: [0.2, 0.5]
    swot_it_tropics_deg: 20.0
    swot_it_floor: 0.3
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-05-17']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-05-18', '2019-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-31']}
  xrds_kw:
    patch_dims: {time: 29, lat: 680, lon: 1440}
    strides: {time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 12}
  aug_kw:
    aug_factor: 1
    aug_only: True

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet_OSSE
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_UNet
    _partial_: true
    lr: 3e-4
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    _target_: src.models_UNet.UNet
    n_channels: 29
    n_classes: 29
    bilinear: True
    block:
      _target_: src.parts.ResBlock
      _partial_: True
    add_input: False
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: contrib.swot_osse.train.finetune_from_weights
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    init_ckpt: ${paths.init_ckpt}

defaults:
  - _self_
