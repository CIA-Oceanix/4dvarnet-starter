# @package _global_

xp_name: glorys4_global_1patch_SLA_UNet_complex_filtered # le nom avec lequel ça sera rangé 
data_name: nrt_sla # données qu'on veut tester -> altimètres processé 2023 en global au 1/4 -> L4 

paths:
  ose_data_path: /Odyssey/public/altimetry_traces/    # les traces  ose_data_path/ processed_2023_... (data_name)
  rec_path:  /Odyssey/public/glorys/rec/              # reconstruction de la SSH avec 4dvarnet à partir des traces /rec_path/xp_name/data_name/
  metrics_path:  /Odyssey/public/glorys/metrics/      # metriques des cartes reconstruites comparées aux traces altimetriques reprocessés / NRT (en fonction du data_name) -> /metrics_path/xp_name/data_name/

  model_config_path: config/xp/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet_complex.yaml
  model_ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SLA_UNet_more_complex/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet_complex/checkpoints/val_mse=3.07202-epoch=250.ckpt

specs:
  pixels_per_degree: 4                 # 1/4° -> regrillage des données traces altimètriques L3 , pour les donner en input au modèle. ils existe,t aussi non grillées pour le calcul des métriques. 

  min_time: 2023-01-01                 # inférence, et pour le téléchargement
  max_time: 2023-12-31
  time_day_crop: 0                     # retirer les jours au début et à la fin -> utile en mapping

  min_lon: -180                        # 
  max_lon: 180
  min_lat: -80
  max_lat: 90

  #IMPORTANT: keep "{}" in place of satellite name in copernicus_dataset_id
  copernicus_dataset_id: cmems_obs-sl_glo_phy-ssh_my_{}-l3-duacs_PT1S               # Global_SSH_forecast_OSE git -> explication 

  input_satellites: ['c2', 'h2ag', 'h2b', 'j3', 's3a', 's3b']                       # dans la même explication
  ref_satellites: ['alg']                                                           # alg réf psk dans le mapping c'est comme ça : D -> mais en forecast on peut utiliser les mêmes satellites en input et en réf, mais au final on utilise pas du tout ça. Input_satellites c'est à la fois inout et à la fois référence pour les métriques.

metrics_spatial_domains:
  GLOBE:
    lat:
      _target_: builtins.slice            # crée un objet python d'une slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  GULFSTREAM:
    lat:
      _target_: builtins.slice
      _args_:
      - 32
      - 42
    lon:
      _target_: builtins.slice
      _args_:
      - -65
      - -55
  GROENLAND:
    lat:
      _target_: builtins.slice
      _args_:
      - 48
      - 58
    lon:
      _target_: builtins.slice
      _args_:
      - -35
      - -25
  MADERE:
    lat:
      _target_: builtins.slice
      _args_:
      - 32
      - 42
    lon:
      _target_: builtins.slice
      _args_:
      - -23
      - -13

options:    # pipeline : données download, concat etc ; 4dvarnet pour reconstruction ; metrics . Skip sert à skip une étape. 
  skip:
    data: False
    rec: False
    metrics: False

  overwrite:         # check si ça existe de base. Si false, il va pas remplacer. Metrics générakement en true.
    data: False   # pas besoin de overwrit'e data téléchargée 
    rec: True    # pas besoin de refaire la reconstruction   
    metrics: False   # pas besoin de recalculer les metriques 

# HYDRA , RIEN CHANGER ! 
entrypoints:
  - _target_: contrib.ose_pipeline.ose_full_pipeline.execute_full_pipeline      # va lancer execute_full_pipeline.py -> inférence ; pour training -> config/
    pixels_per_degree: ${specs.pixels_per_degree}
    min_time: ${specs.min_time}
    max_time: ${specs.max_time}
    min_lon: ${specs.min_lon}
    max_lon: ${specs.max_lon}
    min_lat: ${specs.min_lat}
    max_lat: ${specs.max_lat}
    metrics_spatial_domains: ${metrics_spatial_domains}
    time_day_crop: ${specs.time_day_crop}
    copernicus_dataset_id: ${specs.copernicus_dataset_id}
    input_satellites: ${specs.input_satellites}
    ref_satellites: ${specs.ref_satellites}
    ose_data_path: ${paths.ose_data_path}
    rec_path: ${paths.rec_path}
    metrics_path: ${paths.metrics_path}
    model_config_path: ${paths.model_config_path}
    model_ckpt_path: ${paths.model_ckpt_path}
    xp_name: ${xp_name}
    data_name: ${data_name}
    skip: ${options.skip}
    overwrite: ${options.overwrite}

defaults:
  - _self_

