# @package _global_

paths:
  masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
  glorys12_data: /Odyssey/public/duacs/2010_2019/duacs_2010_2019_0.25deg_float32.nc
    #2023/duacs_2017_2022_0.25deg.nc
  real_traces: /Odyssey/public/altimetry_traces/2010_2019/gridded_0.25deg/sla_l3_all_2010_2019_0.25deg_convl4_float32.nc
    #2010_2023/gridded/sla_l3_all_2010_2023_0.25deg_convl4.nc
  ref_data_l4: ""
  #kpt_path: /Odyssey/public/glorys/trainings/forecast_global_1patch_2016_2019_SLA_UNet_ResBlock_real_data_Nadir_Duacs_losses_DoG/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet_real_data_from_sratch/checkpoints/val_mse=0.01425-epoch=027.ckpt
  ose_data_paths: '' # pas clair ce que c'est !!!!

var_name: "sla_filtered" 
  #-> dans mes fichiers c'est tjrs tout'es les variables dispo, dans les fichiers de Daniel c'est que sla_filtered qui s'appelle simplement sla


domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -179
      - 179

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_1patch_2016_2019_SLA_UNet_ResBlock_OSE_Duacs_loss_val_mse_l3
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 350
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPUOSE
  input_da: 
    _target_: contrib.data_loading.data.open_glorys12_data_sla_OSE_L3 #open_duacs_data_sla
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    real_traces: ${paths.real_traces}
    domain: ${domain.train}
    variables: "sla"
  domains:
    train:
      time: {_target_: builtins.slice, _args_:['2016-01-01', '2019-04-17']}                   # ['2017-01-01', '2022-04-17']}
    val: 
      time: {_target_: builtins.slice, _args_:['2019-04-18', '2019-11-30']}                   # ['2022-04-18', '2022-11-30']}
    test: 
      time: {_target_: builtins.slice,  _args_:['2019-12-31', '2019-12-31']}                  # ['2022-12-31', '2022-12-31']}
  xrds_kw:
    patch_dims: { time: 29, lat: 680, lon: 1440}
    strides: { time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: False # ATTENTION !!!!! CHANGED AUGMENTATION !!!!

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_UNet            #cosanneal_lr_adam
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    _target_: src.models_UNet.UNet    #GradSolverZero
    n_channels: 29
    n_classes: 29
    bilinear: True
    block: 
      _target_: src.parts.ResBlock
      _partial_: True
    add_input: False
  pre_metric_fn:
        _target_: xarray.Dataset.sel
        _partial_: True
        time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
        lat: ${domain.test.lat}
        lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}
    #kpt: ${paths.ckpt_path}

defaults:
  - _self_

