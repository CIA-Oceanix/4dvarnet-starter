    #/Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2016_2019_MSE_finetune_NRT_2024_2025_L4_tgt_lossMSE+Grad_noAug/sst_training_anomalyClimato_MSE_2016_2019_fine_tune/checkpoints/val_mse=0.05388-epoch=069.ckpt
    # /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_AugTrue_MSE+GradLoss_inputL3BilinearInterp_fromCkpt_bigger_period/sst_training_anomalyClimato_MSE_2016_2019/checkpoints/val_mse=0.09742-epoch=024.ckpt
    #/Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_AugTrue_MSE+GradLoss/sst_training_anomalyClimato_MSE_2016_2019/checkpoints/val_mse=16.60604-epoch=263.ckpt
    #/Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2016_2019_AugTrue_MSE_finetune_NRT_L3_tgt/sst_training_anomalyClimato_MSE_2016_2019_fine_tune/checkpoints/val_mse=0.05831-epoch=058.ckpt
    #/Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SST_ODYSSEA_UNet_ResBlock_17M_2010_2019_AugTrue_MSE/sst_training_anomalyClimato_MSE_2016_2019/checkpoints/val_mse=0.09618-epoch=056.ckpt
    #/Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SST_UNet_ResBlock_17M/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SST_UNet/checkpoints/val_mse=2.23058-epoch=343.ckpt
  #ef_data_l4: /Odyssey/public/ODYSSEA_IFREMER_SST/L4/cmems_obs-sst_glo_phy_nrt_l4_P1D-m_multi-vars_179.95W-179.95E_79.95S-79.95N_2023-01-01-2023-12-31.nc

# Variable to reconstruct 
var_name: sst_anomaly


specs:
  pixels_per_degree: 2 #2 #10 #4                 # 1/4° -> regrillage des données traces altimètriques L3 , pour les donner en input au modèle. ils existe,t aussi non grillées pour le calcul des métriques. 

  min_time: 2023-01-01                 # inférence, et pour le téléchargement
  max_time: 2023-12-31
  time_day_crop: 0                     # retirer les jours au début et à la fin -> utile en mapping

  min_lon: -180                        # 
  max_lon: 180
  min_lat: -90
  max_lat: 90

  copernicus_dataset_id: cmems_obs-sl_glo_phy-ssh_nrt_{}-l3-duacs_PT1S

  input_satellites: ['al', 'c2n', 'h2b', 'j3n', 's3a', 's3b']
  ref_satellites: ['s6a-hr']

metrics_spatial_domains:
  GLOBE:
    lat:
      _target_: builtins.slice            # crée un objet python d'une slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  GULFSTREAM:
    lat:
      _target_: builtins.slice
      _args_:
      - 32
      - 42
    lon:
      _target_: builtins.slice
      _args_:
      - -65
      - -55
  GROENLAND:
    lat:
      _target_: builtins.slice
      _args_:
      - 48
      - 58
    lon:
      _target_: builtins.slice
      _args_:
      - -35
      - -25
  MADERE:
    lat:
      _target_: builtins.slice
      _args_:
      - 32
      - 42
    lon:
      _target_: builtins.slice
      _args_:
      - -23
      - -13

options:    # pipeline : données download, concat etc ; 4dvarnet pour reconstruction ; metrics . Skip sert à skip une étape. 
  skip:
    data: True
    rec: False
    metrics: True

  overwrite:         # check si ça existe de base. Si false, il va pas remplacer. Metrics générakement en true.
    data: False   # pas besoin de overwrit'e data téléchargée 
    rec: True    # pas besoin de refaire la reconstruction   
    metrics: False   # pas besoin de recalculer les metriques 

# HYDRA , RIEN CHANGER ! 
entrypoints:
  - _target_: contrib.ose_pipeline.ose_full_pipeline.execute_full_pipeline      # va lancer execute_full_pipeline.py -> inférence ; pour training -> config
    pixels_per_degree: ${specs.pixels_per_degree}
    min_time: ${specs.min_time}
    max_time: ${specs.max_time}
    min_lon: ${specs.min_lon}
    max_lon: ${specs.max_lon}
    min_lat: ${specs.min_lat}
    max_lat: ${specs.max_lat}
    metrics_spatial_domains: ${metrics_spatial_domains}
    time_day_crop: ${specs.time_day_crop}
    copernicus_dataset_id: ${specs.copernicus_dataset_id}
    input_satellites: ${specs.input_satellites}
    ref_satellites: ${specs.ref_satellites}
    ose_data_path: ${paths.ose_data_path}
    rec_path: ${paths.rec_path}
    metrics_path: ${paths.metrics_path}
    model_config_path: ${paths.model_config_path}
    model_ckpt_path: ${paths.model_ckpt_path}
    xp_name: ${xp_name}
    data_name: ${data_name}
    skip: ${options.skip}
    overwrite: ${options.overwrite}

defaults:
  - _self_

