# @package _global_
xp_name: glorys4_global_1patch_SSS_UNet_L3_target_OSE_2015_2019
data_name: nrt_sla

paths:
  ose_data_path: /Odyssey/public/SALINITY_L3/NRT/SSS-L3-2010_2023_asc_desc_averaged_ANOMALY_CLIMATO_f32_QC_controled_flagged.nc
  rec_path:  /Odyssey/public/glorys/rec/
  metrics_path:  /Odyssey/public/glorys/metrics/

  model_config_path: config/xp/sss_ose_training_L3_2015_2019.yaml
  model_ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_SSS_UNet_OSE_L3_target_2015_2019/sss_ose_training_L3_2015_2019/checkpoints/val_mse=1.56897-epoch=339.ckpt

# Variable to reconstruct
var_name: sss_anomaly

specs:
  pixels_per_degree: 4
  min_time: 2023-01-01
  max_time: 2023-12-31
  time_day_crop: 0
  min_lon: -180
  max_lon: 180
  min_lat: -83
  max_lat: 83
  copernicus_dataset_id: cmems_obs-sl_glo_phy-ssh_nrt_{}-l3-duacs_PT1S
  input_satellites: ['al', 'c2n', 'h2b', 'j3n', 's3a', 's3b']
  ref_satellites: ['s6a-hr']

metrics_spatial_domains:
  GLOBE:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  GULFSTREAM:
    lat:
      _target_: builtins.slice
      _args_:
      - 32
      - 42
    lon:
      _target_: builtins.slice
      _args_:
      - -65
      - -55

options:
  skip:
    data: True
    rec: False
    metrics: True
  overwrite:
    data: False
    rec: True
    metrics: False

entrypoints:
  - _target_: contrib.ose_pipeline.ose_full_pipeline.execute_full_pipeline_SSS
    pixels_per_degree: ${specs.pixels_per_degree}
    min_time: ${specs.min_time}
    max_time: ${specs.max_time}
    min_lon: ${specs.min_lon}
    max_lon: ${specs.max_lon}
    min_lat: ${specs.min_lat}
    max_lat: ${specs.max_lat}
    metrics_spatial_domains: ${metrics_spatial_domains}
    time_day_crop: ${specs.time_day_crop}
    copernicus_dataset_id: ${specs.copernicus_dataset_id}
    input_satellites: ${specs.input_satellites}
    ref_satellites: ${specs.ref_satellites}
    ose_data_path: ${paths.ose_data_path}
    rec_path: ${paths.rec_path}
    metrics_path: ${paths.metrics_path}
    model_config_path: ${paths.model_config_path}
    model_ckpt_path: ${paths.model_ckpt_path}
    xp_name: ${xp_name}
    data_name: ${data_name}
    skip: ${options.skip}
    overwrite: ${options.overwrite}

defaults:
  - _self_
